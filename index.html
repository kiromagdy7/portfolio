<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kirollos Magdy</title>
<meta name="robots" content="noindex, follow" />
<link rel="canonical" href="https://kiromagdy.com/" />
<meta http-equiv="refresh" content="3;url=https://kiromagdy.com/" />
<style>
  :root {
    --accent: #2563EB;
    --bg: #0A0A0A;
    --surface: #141414;
    --text: #F5F5F5;
    --muted: #8A8A8A;
    --border: #262626;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px 32px;
    text-align: center;
  }
  .label {
    font-size: 12px;
    letter-spacing: 0.15em;
    color: var(--accent);
    font-family: 'Courier New', monospace;
    margin-bottom: 16px;
    display: block;
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 12px;
    line-height: 1.4;
  }
  p {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.6;
    margin-bottom: 28px;
  }
  p strong { color: var(--text); }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 14px 20px;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    transition: opacity 0.2s ease;
  }
  .btn:hover { opacity: 0.88; }
  .dots {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-top: 24px;
  }
  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 1.2s ease-in-out infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pulse {
    0%, 100% { opacity: 0.25; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .dot { animation: none; opacity: 0.6; }
  }
</style>
</head>
<body>
  <div class="card">
    <span class="label">// Portfolio Moved</span>
    <h1>This portfolio has a new home</h1>
    <p>You're viewing an old version of my portfolio. It now lives at <strong>kiromagdy.com</strong>. Redirecting you automatically&hellip;</p>
    <a class="btn" href="https://kiromagdy.com/">Go to kiromagdy.com →</a>
    <div class="dots" aria-hidden="true">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </div>
</body>
</html>
